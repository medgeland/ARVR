<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kid mode – First Laser Visit – 240137</title>
    <link rel="icon" href="data:,">
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.7.0/dist/aframe-extras.min.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/speech.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/voxel.js"></script>
    <script src="js/kids.js"></script>
</head>
<body>
    <a-scene x0137-kids
             cursor="rayOrigin: mouse"
             raycaster="objects: .clickable, .clickable *"
             renderer="colorManagement: true; antialias: true"
             vr-mode-ui="enabled: true">
        <!-- environment: one room, furniture changes with the state -->
        <a-entity light="type: ambient; color: #ffffff; intensity: 0.8"></a-entity>
        <a-entity light="type: directional; color: #fff6e8; intensity: 1.0" position="-2 4 3"></a-entity>

        <a-plane id="floor" width="8" height="8" rotation="-90 0 0"
                 x0137-texture="src: textures/floor.jpg; repeat: 4 4; color: #d9c7a8"></a-plane>
        <a-plane width="8" height="3" position="0 1.5 -4"
                 x0137-texture="src: textures/wall.jpg; repeat: 3 1; color: #eef3ee; tint: #f4fbf6"></a-plane>
        <a-plane width="8" height="3" position="-4 1.5 0" rotation="0 90 0"
                 x0137-texture="src: textures/wall.jpg; repeat: 3 1; color: #eef3ee; tint: #f4fbf6"></a-plane>
        <a-plane width="8" height="3" position="4 1.5 0" rotation="0 -90 0"
                 x0137-texture="src: textures/wall.jpg; repeat: 3 1; color: #eef3ee; tint: #f4fbf6"></a-plane>
        <a-plane width="8" height="3" position="0 1.5 4" rotation="0 180 0"
                 x0137-texture="src: textures/wall.jpg; repeat: 3 1; color: #eef3ee; tint: #f4fbf6"></a-plane>
        <a-plane width="8" height="8" position="0 3 0" rotation="90 0 0" color="#ffffff"></a-plane>
        <!-- camera rig: seated, the camera only moves when the user moves it -->
        <a-entity id="rig" position="0 0 1.5" wasd-controls="acceleration: 20">
            <a-entity id="cam" camera look-controls position="0 1.2 0">
                <!-- VR subtitle -->
                <a-entity id="x0137-vr-subtitle" position="0 -0.32 -0.95" visible="false"
                           x0137-label="width: 1.4; color: #ffffff; background: rgba(40,53,147,0.9); fontSize: 48"></a-entity>
            </a-entity>
            <a-entity id="left-hand" laser-controls="hand: left" raycaster="objects: .clickable, .clickable *; far: 10"></a-entity>
            <a-entity id="right-hand" laser-controls="hand: right" raycaster="objects: .clickable, .clickable *; far: 10"></a-entity>
        </a-entity>
        <!-- guide: block doctor as a GLB model (own work, made by tools/make_doctor_glb.py).
             Its clips Idle / Talk / Wave / Jump play through aframe-extras' animation-mixer;
             kids.js switches clips and uses the named nodes "Goggles" and "Patch". -->
        <a-entity id="guide" position="1.1 0 -0.9" rotation="0 -30 0"
                  gltf-model="models/doctor.glb"
                  animation-mixer="clip: Idle; loop: repeat"></a-entity>
        <!-- state: waiting -->
        <a-entity x0137-state-group="waiting">
            <a-box class="clickable" x0137-explorable="name: door" width="1" height="2.1" depth="0.08"
                   position="0 1.05 -3.95" color="#8fc1d4"></a-box>
            <a-box width="0.1" height="0.1" depth="0.1" position="0.38 1.0 -3.88" color="#c9a74a"></a-box>
            <a-entity position="-2 0 -1.5">
                <a-box width="0.6" height="0.45" depth="0.6" position="0 0.225 0"
                       x0137-texture="src: textures/leather.jpg; color: #7aa6c2"></a-box>
                <a-box width="0.6" height="0.6" depth="0.1" position="0 0.75 -0.25"
                       x0137-texture="src: textures/leather.jpg; color: #7aa6c2"></a-box>
            </a-entity>
            <a-entity position="-1.2 0 -1.5">
                <a-box width="0.6" height="0.45" depth="0.6" position="0 0.225 0"
                       x0137-texture="src: textures/leather.jpg; color: #7aa6c2"></a-box>
                <a-box width="0.6" height="0.6" depth="0.1" position="0 0.75 -0.25"
                       x0137-texture="src: textures/leather.jpg; color: #7aa6c2"></a-box>
            </a-entity>
            <a-entity position="-3.2 0 -3.2">
                <a-cylinder radius="0.18" height="0.4" position="0 0.2 0" color="#c96f4a"></a-cylinder>
                <a-sphere radius="0.35" position="0 0.75 0" color="#4f9a5a"></a-sphere>
            </a-entity>
            <a-plane width="1.6" height="1" position="-2 1.7 -3.98" color="#bfe3ff"></a-plane>
        </a-entity>

        <!-- state: treatment -->
        <a-entity x0137-state-group="treatment" visible="false">
            <a-entity class="clickable" x0137-explorable="name: couch" position="-1 0 -2">
                <a-box width="1.9" height="0.5" depth="0.7" position="0 0.25 0"
                       x0137-texture="src: textures/leather.jpg; color: #9fd0c7"></a-box>
                <a-box width="0.5" height="0.15" depth="0.7" position="-0.7 0.57 0" color="#ffffff"></a-box>
            </a-entity>
            <a-entity class="clickable" x0137-explorable="name: goggles" position="0.6 0.95 -1.6">
                <a-box width="0.6" height="0.75" depth="0.5" position="0 -0.5 0"
                       x0137-texture="src: textures/wood.jpg; color: #c8a27a"></a-box>
                <a-entity id="table-goggles">
                    <a-box width="0.09" height="0.06" depth="0.03" position="-0.06 0.03 0" color="#ff9a3c"></a-box>
                    <a-box width="0.09" height="0.06" depth="0.03" position="0.06 0.03 0" color="#ff9a3c"></a-box>
                    <a-box width="0.04" height="0.015" depth="0.03" position="0 0.04 0" color="#37474f"></a-box>
                </a-entity>
            </a-entity>
            <a-entity id="kid-device" class="clickable" x0137-explorable="name: device" position="1.6 0 -2">
                <a-box width="0.5" height="0.9" depth="0.5" position="0 0.45 0" color="#e9eef3"></a-box>
                <a-box width="0.36" height="0.12" depth="0.02" position="0 0.7 0.26" color="#283593"></a-box>
                <a-box width="0.12" height="0.25" depth="0.12" position="0 1.02 0" color="#ffffff"></a-box>
            </a-entity>
            <!-- the hand piece: it rests on device and travels to the doctor's hand in the demo.
                 Its light face is on +z, so object3D.lookAt() points it at the patch. -->
            <a-entity id="kid-wand" position="1.6 1.2 -2">
                <a-box width="0.14" height="0.09" depth="0.16" color="#ffffff"></a-box>
                <a-box width="0.05" height="0.05" depth="0.12" position="0 0 -0.12" color="#5f6670"></a-box>
                <a-box id="kid-wand-light" width="0.1" height="0.06" depth="0.006" position="0 0 0.082"
                       material="color: #8ab4ff; emissive: #8ab4ff; emissiveIntensity: 0.2"></a-box>
                <a-entity id="kid-wand-glow" light="type: point; color: #a9c6ff; intensity: 0; distance: 0.6" position="0 0 0.12"></a-entity>
            </a-entity>
            <a-cylinder radius="0.2" height="0.5" position="0.2 0.25 -2.6" color="#d0d6dc"></a-cylinder>
        </a-entity>

        <!-- state: helper ("Your turn"): child treats light spot on the doctor's forearm.
            doctor stands behind little table (kids.js moves the GLB there). -->
        <a-entity x0137-state-group="helper" visible="false">
            <!-- child's goggles -->
            <a-entity id="kid-goggles" class="clickable" x0137-explorable="name: kgoggles" position="-0.27 1.025 0.84">
                <a-box width="0.09" height="0.05" depth="0.03" position="-0.055 0 0" color="#ff9a3c"></a-box>
                <a-box width="0.09" height="0.05" depth="0.03" position="0.055 0 0" color="#ff9a3c"></a-box>
                <a-box width="0.03" height="0.012" depth="0.03" position="0 0.01 0" color="#37474f"></a-box>
            </a-entity>
            <!-- treatment tray: sunscreen tube, folded cotton cloth, and 3 light windows (added by kids.js) -->
            <a-entity id="kid-tray" position="0.03 1.005 0.84">
                <a-box width="0.44" height="0.01" depth="0.1" color="#cfd8dc"></a-box>
                <a-box width="0.44" height="0.02" depth="0.008" position="0 0.01 0.05" color="#b0bec5"></a-box>
                <a-box width="0.44" height="0.02" depth="0.008" position="0 0.01 -0.05" color="#b0bec5"></a-box>
                <a-entity id="kid-tube" class="clickable" x0137-explorable="name: tube" position="-0.15 0.022 0" rotation="0 20 0">
                    <a-box width="0.09" height="0.026" depth="0.035" color="#ffffff"></a-box>
                    <a-box width="0.022" height="0.028" depth="0.037" position="0.05 0 0" color="#ff9a3c"></a-box>
                </a-entity>
                <a-box id="kid-cloth" class="clickable" x0137-explorable="name: towel" width="0.08" height="0.025" depth="0.07"
                       position="-0.05 0.018 0" color="#f5f5f0"></a-box>
            </a-entity>
            <!-- light device, the same block model as in the Trainer; its origin is the light window -->
            <a-entity id="kid-hand-device" x0137-voxel-model="model: excimer" position="0.42 1.002 0.82"></a-entity>
        </a-entity>

        <!-- helper + done: table (chest height, so it sits in the middle of the seated view) and doctor's forearm (time-lapse plays on it too) -->
        <a-entity x0137-state-group="helper done" visible="false">
            <a-box width="0.85" height="0.04" depth="0.52" position="0.1 0.98 0.64"
                   x0137-texture="src: textures/wood.jpg; color: #c8a27a"></a-box>
            <a-box width="0.05" height="0.96" depth="0.05" position="-0.28 0.48 0.86" color="#a88660"></a-box>
            <a-box width="0.05" height="0.96" depth="0.05" position="0.48 0.48 0.86" color="#a88660"></a-box>
            <a-box width="0.05" height="0.96" depth="0.05" position="-0.28 0.48 0.42" color="#a88660"></a-box>
            <a-box width="0.05" height="0.96" depth="0.05" position="0.48 0.48 0.42" color="#a88660"></a-box>
            <!-- upper arm in the white coat, from the doctor's shoulder down to the elbow on the table -->
            <a-box width="0.11" height="0.47" depth="0.12" position="0.21 1.21 0.365" rotation="-54.9 0 14.8" color="#f5f5f5"></a-box>
            <!-- padded armrest, tilted 45° toward the child so the skin faces them -->
            <a-box width="0.64" height="0.06" depth="0.17" position="0.03 1.03 0.57" rotation="45 0 0" color="#9fd0c7"></a-box>
            <!-- forearm across the armrest: elbow at the doctor's side, hand to the child's left (local +x = world -x) -->
            <a-entity id="kid-arm" position="0.065 1.08 0.6" rotation="45 180 0">
                <a-box width="0.06" height="0.078" depth="0.108" position="-0.24 0.009 0" color="#f5f5f5"></a-box>
                <a-box width="0.014" height="0.082" depth="0.112" position="-0.207 0.011 0" color="#e0e0e0"></a-box>
                <a-entity id="kid-skin" class="clickable" x0137-voxel-skin="voxelMm: 4; skin: #e8b98f"></a-entity>
                <a-box width="0.1" height="0.032" depth="0.078" position="0.175 -0.014 0" color="#e8b98f"></a-box>
                <a-box width="0.07" height="0.022" depth="0.017" position="0.258 -0.019 -0.028" color="#e8b98f"></a-box>
                <a-box width="0.082" height="0.022" depth="0.017" position="0.264 -0.019 -0.009" color="#e8b98f"></a-box>
                <a-box width="0.078" height="0.022" depth="0.017" position="0.262 -0.019 0.01" color="#e8b98f"></a-box>
                <a-box width="0.06" height="0.022" depth="0.016" position="0.253 -0.019 0.029" color="#e8b98f"></a-box>
                <a-box width="0.06" height="0.022" depth="0.02" position="0.17 -0.019 0.052" rotation="0 -35 0" color="#e8b98f"></a-box>
            </a-entity>
        </a-entity>

        <!-- state: done: medal + "Visit 3 of 6" left of the table (the parent card sits top right); patch on the forearm fills in -->
        <a-entity x0137-state-group="done" visible="false">
            <a-entity id="kids-medal" position="-0.5 1.33 0.55"
                      animation="property: rotation; from: 0 -12 0; to: 0 12 0; dir: alternate; loop: true; dur: 2200; easing: easeInOutSine">
                <a-box width="0.04" height="0.12" depth="0.006" position="-0.028 0.095 0" rotation="0 0 -18" color="#283593"></a-box>
                <a-box width="0.04" height="0.12" depth="0.006" position="0.028 0.095 0" rotation="0 0 18" color="#283593"></a-box>
                <a-cylinder radius="0.07" height="0.016" rotation="90 0 0" color="#f9a825"></a-cylinder>
                <a-cylinder radius="0.05" height="0.018" rotation="90 0 0" color="#ffd54f"></a-cylinder>
            </a-entity>
            <!-- canvas label, so Russian works -->
            <a-entity id="kids-done-label" position="-0.5 1.17 0.55"
                      x0137-label="width: 0.42; color: #ffffff; background: #283593; fontSize: 90"></a-entity>
        </a-entity>
    </a-scene>
</body>
</html>
