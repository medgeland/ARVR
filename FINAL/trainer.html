<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trainer – First Laser Visit – 240137</title>
    <link rel="icon" href="data:,">
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/speech.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/voxel.js"></script>
    <script src="js/trainer.js"></script>
</head>
<body>
    <a-scene x0137-trainer
             cursor="rayOrigin: mouse"
             raycaster="objects: .clickable, .clickable *"
             renderer="colorManagement: true; antialias: true">
        <a-entity light="type: ambient; color: #ffffff; intensity: 0.8"></a-entity>
        <a-entity light="type: directional; color: #ffffff; intensity: 1.1" position="1 4 2"></a-entity>

        <!-- room -->
        <a-plane width="6" height="6" rotation="-90 0 0"
                 x0137-texture="src: textures/floor.jpg; repeat: 3 3; color: #d9c7a8"></a-plane>
        <a-plane width="6" height="3" position="0 1.5 -2"
                 x0137-texture="src: textures/wall.jpg; repeat: 2 1; color: #eef1f5"></a-plane>
        <a-plane width="6" height="3" position="-3 1.5 0" rotation="0 90 0"
                 x0137-texture="src: textures/wall.jpg; repeat: 2 1; color: #eef1f5"></a-plane>
        <a-plane width="6" height="3" position="3 1.5 0" rotation="0 -90 0"
                 x0137-texture="src: textures/wall.jpg; repeat: 2 1; color: #eef1f5"></a-plane>
        <a-plane width="6" height="3" position="0 1.5 3" rotation="0 180 0"
                 x0137-texture="src: textures/wall.jpg; repeat: 2 1; color: #eef1f5"></a-plane>
        <a-plane width="6" height="6" position="0 3 0" rotation="90 0 0" color="#ffffff"></a-plane>

        <!-- camera: seated close to table, looking down at the arm.
             fov 50 on desktop makes the 3 mm skin blocks readable, headset ignores it. -->
        <!-- W A S D / arrows: walk slowly around the table to look at the spot from the side -->
        <a-entity id="rig" position="0 0 0.18">
            <a-entity id="cam" camera="fov: 50" look-controls wasd-controls="acceleration: 6; fly: false" position="0 1.25 0">
                <a-entity id="x0137-vr-subtitle" position="0 -0.32 -0.95" visible="false"
                           x0137-label="width: 1.2; color: #ffffff; background: rgba(40,53,147,0.9); fontSize: 48"></a-entity>
            </a-entity>
            <a-entity id="left-hand" laser-controls="hand: left" raycaster="objects: .clickable, .clickable *; far: 5"></a-entity>
            <a-entity id="right-hand" laser-controls="hand: right" raycaster="objects: .clickable, .clickable *; far: 5"></a-entity>
        </a-entity>

        <!-- table -->
        <a-box width="1.6" height="0.05" depth="0.9" position="0 0.75 -0.2"
               x0137-texture="src: textures/wood.jpg; color: #c8a27a"></a-box>
        <a-box width="1.5" height="0.72" depth="0.05" position="0 0.36 -0.62" color="#a88660"></a-box>

        <!-- user's own forearm, resting on the table palm down, as in a real home session.
             It lies across the table, hand to the right: local +x = world +x; local y = 0 is 3 cm above the table.
             The forearm skin is a voxel grid; lesion, moles, towel, ruler are added by trainer.js. -->
        <a-entity id="arm" position="0.02 0.805 -0.1" rotation="0 0 0">
            <!-- sleeve -->
            <a-box width="0.08" height="0.078" depth="0.108" position="-0.25 0.009 0" color="#3d5a80"></a-box>
            <a-box width="0.014" height="0.082" depth="0.112" position="-0.207 0.011 0" color="#2f4866"></a-box>
            <!-- forearm skin: 3 mm blocks -->
            <a-entity id="skin" class="clickable" x0137-voxel-skin="voxelMm: 3"></a-entity>
            <!-- hand -->
            <a-box width="0.1" height="0.032" depth="0.078" position="0.175 -0.014 0" color="#e3b48f"></a-box>
            <a-box width="0.012" height="0.034" depth="0.078" position="0.13 -0.013 0" color="#d9a77f"></a-box>
            <!-- fingers -->
            <a-box width="0.07" height="0.022" depth="0.017" position="0.258 -0.019 -0.028" color="#e3b48f"></a-box>
            <a-box width="0.082" height="0.022" depth="0.017" position="0.264 -0.019 -0.009" color="#e3b48f"></a-box>
            <a-box width="0.078" height="0.022" depth="0.017" position="0.262 -0.019 0.01" color="#e3b48f"></a-box>
            <a-box width="0.06" height="0.022" depth="0.016" position="0.253 -0.019 0.029" color="#e3b48f"></a-box>
            <!-- thumb -->
            <a-box width="0.06" height="0.022" depth="0.02" position="0.17 -0.019 0.052" rotation="0 -35 0" color="#e3b48f"></a-box>
        </a-entity>

        <!-- goggles -->
        <a-entity class="clickable" x0137-tool="name: goggles" position="-0.3 0.795 -0.3">
            <a-box width="0.09" height="0.05" depth="0.03" position="-0.055 0 0" color="#ff9a3c" opacity="0.85"></a-box>
            <a-box width="0.09" height="0.05" depth="0.03" position="0.055 0 0" color="#ff9a3c" opacity="0.85"></a-box>
            <a-box width="0.03" height="0.012" depth="0.03" position="0 0.01 0" color="#333"></a-box>
        </a-entity>

        <!-- sunscreen tube -->
        <a-entity id="tube" class="clickable" x0137-tool="name: tube" position="-0.1 0.79 -0.34" rotation="0 30 0">
            <a-box width="0.12" height="0.03" depth="0.04" color="#ffffff"></a-box>
            <a-box width="0.03" height="0.032" depth="0.042" position="0.065 0 0" color="#ff9a3c"></a-box>
        </a-entity>

        <!-- cotton towel, folded on the table -->
        <a-box class="clickable" x0137-tool="name: towel" width="0.2" height="0.03" depth="0.14"
               position="0.2 0.79 0.06" color="#f5f5f0"></a-box>

        <!-- nozzle tray: filled from CONFIG.nozzles by trainer.js -->
        <a-entity id="nozzle-tray" position="-0.44 0.78 0.05">
            <a-box width="0.3" height="0.01" depth="0.06" position="0.12 0 0" color="#9aa3ad"></a-box>
        </a-entity>

        <!-- the device, built from a voxel layer map; its origin is the light window.
             At rest it stands on the table; in the treat state it follows the pointer. -->
        <a-entity id="device" position="0.42 0.776 0.03" x0137-voxel-model="model: excimer"></a-entity>
    </a-scene>
</body>
</html>
