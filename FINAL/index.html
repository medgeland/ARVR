<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>First Laser Visit – 240137</title>
    <link rel="icon" href="data:,">
    <style>
        /* landing page: colours, font, sizes; cards wrap to one column on mobile web */
        body {
            margin: 0;
            padding: 24px 16px;
            background: #283593;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
            line-height: 1.4;
        }
        main { max-width: 900px; margin: 0 auto; }
        h1 { font-size: 30px; }
        h2 { font-size: 18px; }
        a { color: #ffffff; }
        .cards { display: flex; flex-wrap: wrap; gap: 16px; }
        .card {
            flex: 1 1 260px;
            display: block;
            padding: 20px;
            background: #ffffff;
            color: #1a1a2e;
            text-decoration: none;
        }
        .card-title { display: block; font-size: 22px; font-weight: bold; margin-bottom: 8px; }
        .card-line, .card-disclaimer, .card-go { display: block; margin-top: 8px; }
        .card-disclaimer { background: #fff3c4; padding: 6px; }
        .card-go { font-weight: bold; color: #283593; }
        .lang-btn[aria-pressed="true"] { font-weight: bold; }
    </style>
    <script src="js/i18n.js"></script>
</head>
<body>
    <main class="page">
        <header class="top">
            <div>
                <h1 data-i18n="app.title">First Dermatologist Laser Visit</h1>
                <p class="subtitle" data-i18n="app.subtitle"></p>
            </div>
            <!-- language toggle, passed on as ?lang= -->
            <div class="lang" role="group" aria-label="Language">
                <button type="button" class="lang-btn" data-lang="ru">RU</button>
                <button type="button" class="lang-btn" data-lang="en">EN</button>
            </div>
        </header>
        <!-- Two mode cards - home treatment / visit for kids -->
        <section class="cards">
            <a class="card card-kid" id="card-kid" href="kids.html">
                <span class="card-title" data-i18n="card.kid.title"></span>
                <span class="card-line" data-i18n="card.kid.line"></span>
                <span class="card-go" data-i18n="card.open"></span>
            </a>
            <a class="card card-trainer" id="card-trainer" href="trainer.html">
                <span class="card-title" data-i18n="card.trainer.title"></span>
                <span class="card-line" data-i18n="card.trainer.line"></span>
                <!-- Training disclaimer -->
                <span class="card-disclaimer" data-i18n="card.trainer.disclaimer"></span>
                <span class="card-go" data-i18n="card.open"></span>
            </a>
        </section>
         <!-- Device note -->
        <p class="device-note" data-i18n="device.note"></p>

        <!-- Privacy, shown before any mic prompt (mic is only requested inside a scene) -->
        <section class="privacy" aria-labelledby="privacy-title">
            <h2 id="privacy-title" data-i18n="privacy.title"></h2>
            <p data-i18n="privacy.body"></p>
        </section>

        <!-- Credits -->
        <footer class="foot">
            <a href="https://github.com/medgeland/ARVR/FINAL/README.md" data-i18n="credits.link"></a>
            <span>· 240137</span>
        </footer>
    </main>
    <script>
        (function () {
            const i18n = window.X0137_I18N;
            function render() {
                i18n.apply();
                document.title = i18n.t("app.title") + " – 240137";
                document.getElementById("card-kid").href = "kids.html?lang=" + i18n.lang;
                document.getElementById("card-trainer").href = "trainer.html?lang=" + i18n.lang;
                document.querySelectorAll(".lang-btn").forEach(function (b) {
                    b.setAttribute("aria-pressed", b.dataset.lang === i18n.lang ? "true" : "false");
                });
            }
            document.querySelectorAll(".lang-btn").forEach(function (b) {
                b.addEventListener("click", function () {
                    i18n.setLang(b.dataset.lang);
                    render();
                });
            });
            // Safari only lets page speak after user gesture. The card tap is that gesture:
            // empty utterance "unlocks" speechSynthesis for the next page on iOS
            document.querySelectorAll(".card").forEach(function (card) {
                card.addEventListener("click", function () {
                    if ("speechSynthesis" in window) {
                        try {
                            const u = new SpeechSynthesisUtterance(" ");
                            u.volume = 0;
                            window.speechSynthesis.speak(u);
                        } catch (e) { /* ignore */ }
                    }
                });
            });

            render();
        })();
    </script>
</body>
</html>
